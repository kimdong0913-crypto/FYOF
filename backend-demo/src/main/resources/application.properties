spring.application.name=demo
server.port=8081
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=40MB
ai.url=http://localhost:8000

# --- Google Cloud SQL (MySQL) ---
# 비밀번호 등 민감한 값은 환경변수 또는 backend-demo/db.properties(깃에 올리지 않음)에 둔다.
spring.config.import=optional:file:./db.properties
cloudsql.instance=<GCP-프로젝트-ID>:asia-northeast3:cvfbgn123
spring.datasource.url=jdbc:mysql:///${DB_NAME:fyof}?cloudSqlInstance=${cloudsql.instance}&socketFactory=com.google.cloud.sql.mysql.SocketFactory&ipTypes=${DB_IP_TYPES:PUBLIC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
# DB 가 아직 준비되지 않아도 서버(가상 피팅 등)는 뜨도록 연결 실패를 빨리 포기한다.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.initialization-fail-timeout=-1
